<!doctype html>
<html><head><meta charset="utf-8"><style>
  @page { size: 1200px 630px; margin: 0 }
  * { margin:0; padding:0; box-sizing:border-box }
  html,body { width:1200px; height:630px }
  body {
    background:#1A1814;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    position:relative; overflow:hidden;
  }
  /* banda gialla in basso: firma del brand */
  .banda { position:absolute; left:0; right:0; bottom:0; height:14px; background:#FFBF00 }
  img { width:560px; display:block }
  p { color:#E5E0D8; font-size:30px; letter-spacing:.01em; margin-top:40px;
      font-family:Georgia,"Times New Roman",serif; font-style:italic }
  .dom { color:#FFBF00; font-size:22px; font-weight:700; letter-spacing:.14em;
         text-transform:uppercase; margin-top:28px }
</style></head>
<body>
  <img src="logo-neg.svg" alt="">
  <p>Pensare con rigore. Costruire con coraggio.</p>
  <div class="dom">rethinkuni.it</div>
  <div class="banda"></div>
</body></html>
